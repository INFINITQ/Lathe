# Builds Lathe's Windows installer (Lathe_<version>_x64-setup.exe) and its SHA-256 checksum.
#
# - Pushing a tag such as v0.2.0 also checks that the tag matches the app's version and attaches
#   the installer to a draft GitHub Release. README.md, "Releasing", has the steps.
# - "Run workflow" in the Actions tab builds it from any branch, as an artifact of the run.
# - A pull request that changes this file gets the same test build, so a broken release workflow
#   shows up before a release needs it.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

# One build per tag or branch at a time; a newer push to a pull request replaces its old build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-version in Cargo.toml.
  RUST_TOOLCHAIN: 1.99-x86_64-pc-windows-msvc

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:RUST_TOOLCHAIN

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the same tag could restore a tag's cache, so tag builds don't save one.
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Check the version
        id: version
        run: |
          function Fail([string] $Message) {
            Write-Output "::error::$Message"
            exit 1
          }

          # --locked also catches a Cargo.lock that wasn't updated after a version bump.
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { Fail 'Cargo.lock is out of date: run cargo check, then commit Cargo.lock.' }

          $tauri = (Get-Content -Raw apps/lathe/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $workspace = cargo metadata --no-deps --offline --format-version 1 | ConvertFrom-Json
          $cargo = ($workspace.packages | Where-Object name -eq 'lathe').version
          if (-not $tauri -or $tauri -ne $cargo) {
            Fail "tauri.conf.json has version '$tauri' but Cargo.toml has '$cargo'. Set both to the same version."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$tauri") {
            Fail "The tag $env:GITHUB_REF_NAME doesn't match the app version $tauri (expected v$tauri)."
          }
          Write-Output "Building Lathe $tauri"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$tauri"

      - name: Install pnpm
        # No version here: it comes from packageManager in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm build

      - name: Write the checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Lathe_$($env:VERSION)_x64-setup.exe"
          $installer = "target/release/bundle/nsis/$name"
          if (-not (Test-Path -LiteralPath $installer)) {
            Get-ChildItem -Recurse -ErrorAction SilentlyContinue target/release/bundle | ForEach-Object FullName
            Write-Output "::error::The build didn't make $installer."
            exit 1
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          # sha256sum's format, so `sha256sum -c` can check it too.
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $name`n" -NoNewline -Encoding ascii
          $size = '{0:N1} MB' -f ((Get-Item -LiteralPath $installer).Length / 1MB)
          Write-Output "$name ($size), SHA-256 $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $name`n`n$size, SHA-256 $hash"

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lathe_${{ steps.version.outputs.version }}_x64-setup
          path: |
            target/release/bundle/nsis/Lathe_${{ steps.version.outputs.version }}_x64-setup.exe
            target/release/bundle/nsis/Lathe_${{ steps.version.outputs.version }}_x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

  # A separate job, so the build (which runs code from npm and crates.io) never holds a token
  # that can write to the repository.
  release:
    name: Draft the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lathe_${{ needs.build.outputs.version }}_x64-setup
          path: installer

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Delete it on the Releases page, then re-run this job."
            exit 1
          fi

          sed "s/@VERSION@/$VERSION/g" > notes.md << 'EOF'
          Download `Lathe_@VERSION@_x64-setup.exe` below and run it. It installs Lathe for you alone, without administrator rights.

          The installer isn't code-signed yet, so Windows SmartScreen may stop it with "Windows protected your PC". Click **More info**, then **Run anyway**.

          To check the download, run `Get-FileHash Lathe_@VERSION@_x64-setup.exe` in PowerShell. The hash it prints should match the one in the `.sha256` file.
          EOF

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # The notes above go first; GitHub adds the merged pull requests after them.
          url=$(gh release create "$TAG" installer/* --draft --verify-tag --title "Lathe $VERSION" \
            --notes-file notes.md --generate-notes "${prerelease[@]}")
          echo "Draft release: $url"
          echo "[Draft release for $TAG]($url): check the notes, then publish it." >> "$GITHUB_STEP_SUMMARY"
